name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .toolchain
          key: goose-${{ runner.os }}-${{ hashFiles('GOOSE_REVISION', 'scripts/setup-goose.sh') }}
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev pkg-config clang
      - run: make setup
      - run: make check test
      - run: make test-native CC=gcc
      - run: make test-native CC=clang
      - run: make fuzz-native FUZZ_RUNS=10000
      - run: make bench BENCH_ITERATIONS=10
      - run: git diff --exit-code && git diff --check
